server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    # API + uploaded files → the Laravel container (same compose network).
    location /api/ {
        proxy_pass http://schoole-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location /storage/ {
        proxy_pass http://schoole-api:8000;
        proxy_set_header Host $host;
        add_header X-Content-Type-Options nosniff;
    }

    # PWA manifest needs its own MIME type (nginx has none for .webmanifest).
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    # No-build app: never let a CDN/browser serve stale JS/CSS after a deploy
    # (the service worker keeps its own offline copy).
    location /assets/ {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    # Static frontends: landing, login, /app (school), /super (platform), /parent (portal).
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        etag off;
        if_modified_since off;
        try_files $uri $uri/ =404;
    }
}
