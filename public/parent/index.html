<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بوابة ولي الأمر — سكوول</title>
<link rel="stylesheet" href="/assets/css/app.css">
<style>
  .ptop{background:linear-gradient(140deg,var(--accent),#7c5ce6);color:#fff;padding:18px 16px 70px}
  .ptop .in{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:12px}
  .ptop .lg{width:46px;height:46px;border-radius:13px;background:#fff;color:var(--accent);display:grid;place-items:center;overflow:hidden}
  .ptop .lg img{width:100%;height:100%;object-fit:cover}.ptop .lg svg{width:24px;height:24px}
  .ptop h1{font-size:18px}.ptop small{opacity:.85}
  .ptop button{color:#fff;opacity:.9}.ptop .tbtn:hover{background:rgba(255,255,255,.15);color:#fff}
  .pwrap{max-width:960px;margin:-50px auto 40px;padding:0 14px}
  .kid{display:flex;gap:14px;align-items:center;cursor:pointer;transition:.15s}
  .kid:hover{border-color:var(--accent);transform:translateY(-2px)}
  .kid .avatar{width:54px;height:54px;font-size:20px}
  .ptabs{display:flex;gap:6px;margin-bottom:14px;background:var(--card);padding:5px;border-radius:12px;border:1px solid var(--line);width:fit-content}
  .ptabs a{padding:7px 16px;border-radius:9px;font-weight:600;color:var(--text-2)}.ptabs a.on{background:var(--accent);color:#fff}
</style>
</head>
<body>
<div class="spin" style="margin-top:30vh"></div>
<script src="/assets/js/core.js"></script>
<script src="/assets/js/i18n-dict.js"></script>
<script src="/assets/js/i18n.js"></script>
<script src="/assets/js/student-view.js"></script>
<script>
(async () => {
  const { esc, ic } = S;
  if (!S.token()) return (location.href = '/login.html');
  let me; try { me = await S.get('/auth/me'); } catch { return; }
  if (me.user.role !== 'guardian') return (location.href = me.home);
  S.setSession(null, me);
  document.body.innerHTML = `<div class="ptop"><div class="in"><div class="lg">${me.company.logo ? `<img src="${esc(me.company.logo)}">` : S.LOGO}</div><div class="grow"><h1>${esc(me.company.name)}</h1><small>بوابة ولي الأمر — مرحباً ${esc(me.user.name)}</small></div><button class="tbtn" id="lng" title="English / العربية" style="font-weight:800;font-size:12px">${S.isEn && S.isEn() ? 'ع' : 'EN'}</button><button class="tbtn" id="mode">${ic('moon')}</button><button class="tbtn" id="out" title="خروج">${ic('logout')}</button></div></div><div class="pwrap"><div class="ptabs"><a href="#/" data-r="">الرئيسية</a><a href="#/payments" data-r="payments">المدفوعات</a></div><div id="v"></div></div>`;
  document.getElementById('mode').onclick = S.toggleMode;
  const _lng = document.getElementById('lng'); if (_lng) _lng.onclick = () => S.toggleLang();
  S.i18nStart && S.i18nStart();
  document.getElementById('out').onclick = async () => { try { await S.post('/auth/logout'); } catch {} S.clearSession(); location.href = '/login.html'; };
  const v = document.getElementById('v');
  const stat = (cls, i, val, k) => `<div class="stat ${cls}"><div class="ic">${ic(i)}</div><div><div class="v num">${val}</div><div class="k">${k}</div></div></div>`;

  async function home() {
    const d = await S.get('/portal/home');
    const w = d.view || {}, f = d.finance;
    const payTab = document.querySelector('.ptabs a[data-r="payments"]'); if (payTab) payTab.style.display = w.finance ? '' : 'none';
    const badges = (c) => { const m = c.monitor || {}; const b = []; if (w.attendance && m.attendance_rate != null) b.push(`<span class="bdg ${m.attendance_rate >= 90 ? 'l-ok' : m.attendance_rate >= 75 ? 'l-warn' : 'l-bad'}">الحضور ${m.attendance_rate}%</span>`); if (w.attendance) b.push(`<span class="bdg ${m.absences ? 'l-bad' : 'l-mut'}">غياب ${m.absences || 0}</span>`); if (w.assignments && m.pending) b.push(`<span class="bdg l-warn">${m.pending} واجب معلّق</span>`); if (w.assignments && m.upcoming) b.push(`<span class="bdg l-info">${m.upcoming} اختبار قريب</span>`); if (c.bus) b.push(`<span class="bdg l-mut">الحافلة ${esc(c.bus.number)}</span>`); return `<div class="row mt8 wrap">${b.join('')}</div>`; };
    v.innerHTML = `<div class="sec-t" style="margin-top:0">${ic('users')} أبنائي — المتابعة</div>
      <div class="grid g2 mb16">${d.children.map((c) => `<a class="card pad kid" href="#/child/${c.id}">${S.avatarHtml ? S.avatarHtml(c.photo, c.name) : `<span class="avatar">${esc(S.initials(c.name))}</span>`}<div class="grow"><b style="font-size:15px">${esc(c.name)}</b><div class="muted sm">${esc(c.grade?.name_ar || '')} — ${esc(c.section?.name || '')} · <span class="num">${esc(c.student_no || '')}</span></div>${badges(c)}</div>${ic('chevL')}</a>`).join('') || S.emptyHtml('لا يوجد أبناء مسجلون')}</div>
      ${f ? `<div class="card pad mb16 row wrap" style="align-items:center;gap:14px"><span class="avatar" style="background:var(--accent-soft);color:var(--accent)">${ic('coins')}</span><div class="grow"><b>الرسوم الدراسية</b><div class="muted sm">المتبقي <b class="bad-t">${S.moneyT(f.remaining)}</b> من إجمالي ${S.moneyT(f.total)}${f.next_due ? ` · القسط القادم ${S.moneyT(f.next_due.remaining)} بتاريخ ${S.d(f.next_due.due_date)}` : ''}</div></div><a class="btn ghost sm" href="#/payments">${ic('receipt')} سجل المدفوعات</a></div>` : ''}
      ${d.announcements.length ? `<div class="sec-t">${ic('megaphone')} إعلانات المدرسة</div>${d.announcements.map((a) => `<div class="card pad mb8"><b>${esc(a.title)}</b><p class="t2 sm" style="white-space:pre-line">${esc(a.body || '')}</p><span class="muted xs">${S.ago(a.created_at)}</span></div>`).join('')}` : ''}`;
    v.querySelectorAll('.kid>svg').forEach((s) => (s.style.cssText = 'width:18px;height:18px;color:var(--muted)'));
  }
  let CHILD = { id: null, data: null };
  const contractCard = (c) => `<div class="card mb16"><div class="hd"><h3>${ic('contract')} عقد <span class="num">${esc(c.number)}</span></h3><span class="grow"></span>${S.badge(S.ST.contract, c.status)}</div><div class="bd"><div class="grid g3 mb16">${stat('c-violet', 'coins', S.money(c.total, true), 'الإجمالي')}${stat('c-green', 'check', S.money(c.paid, true), 'المدفوع')}${stat('c-red', 'timer', S.money(c.remaining, true), 'المتبقي')}</div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>القسط</th><th>تاريخ الاستحقاق</th><th>المبلغ</th><th>المدفوع</th><th>الحالة</th></tr></thead><tbody>${c.installments.map((i) => `<tr class="${i.is_overdue ? 'warn-row' : ''}"><td>${i.seq}</td><td class="num">${S.d(i.due_date)}</td><td class="num">${S.fmtN(i.amount)}</td><td class="num ok-t">${S.fmtN(i.paid)}</td><td>${S.badge(S.ST.inst, i.is_overdue ? 'overdue' : i.status)}</td></tr>`).join('')}</tbody></table></div></div></div>`;

  async function child(id, tab) {
    if (String(CHILD.id) !== String(id) || !CHILD.data) CHILD = { id, data: await S.get('/portal/children/' + id) };
    const d = CHILD.data, s = d.student, w = d.view || {};
    const tabs = [['overview', 'نظرة عامة']];
    if (w.assignments && d.assignments) tabs.push(['assignments', 'الواجبات والاختبارات']);
    if (w.grades && d.report) tabs.push(['grades', 'الدرجات']);
    if (w.attendance && d.attendance) tabs.push(['attendance', 'الحضور']);
    if (w.timetable && d.timetable) tabs.push(['timetable', 'الجدول']);
    if (w.behavior && d.notes) tabs.push(['behavior', 'السلوك']);
    if (w.finance && d.contracts && d.contracts.length) tabs.push(['fees', 'الرسوم']);
    if (!tabs.some(([k]) => k === tab)) tab = 'overview';
    v.innerHTML = `<a href="#/" class="btn ghost sm mb16">${ic('chevR')} رجوع لأبنائي</a>
      <div class="card pad mb16"><div class="profile-h" style="margin:0">${S.avatarHtml ? S.avatarHtml(s.photo, s.name) : `<span class="avatar">${esc(S.initials(s.name))}</span>`}<div class="grow"><h3>${esc(s.name)}</h3><div class="muted">${esc(s.grade?.name_ar || '')} — ${esc(s.section?.name || '')} · <span class="num">${esc(s.student_no || '')}</span></div></div>${S.badge(S.ST.student, s.status)}</div></div>
      <div class="ptabs">${tabs.map(([k, l]) => `<a href="#/child/${id}/${k}" data-sub="${k}" class="${k === tab ? 'on' : ''}">${l}</a>`).join('')}</div>
      <div id="ct"></div>`;
    childTab(d, tab);
  }

  function childTab(d, tab) {
    const ct = v.querySelector('#ct'), s = d.student, m = d.monitor || {}, w = d.view || {};
    if (tab === 'assignments') return (ct.innerHTML = S.sv.assignments(d.assignments, { emptySub: 'لم ينشئ المعلّمون واجبات لهذه الشعبة بعد.' }));
    if (tab === 'grades') return (ct.innerHTML = S.sv.reportCard(d.report));
    if (tab === 'attendance') return (ct.innerHTML = S.sv.attendance(d.attendance));
    if (tab === 'timetable') return (ct.innerHTML = S.sv.timetable(d.timetable));
    if (tab === 'behavior') return (ct.innerHTML = S.sv.notes(d.notes, { emptySub: 'لا توجد ملاحظات سلوكية مسجّلة.' }));
    if (tab === 'fees') return (ct.innerHTML = d.contracts.map(contractCard).join(''));
    // overview: quick KPIs + today's lessons + bus
    const stats = [];
    if (w.attendance) stats.push(stat('c-green', 'calCheck', m.attendance_rate != null ? S.fmtN(m.attendance_rate, 1) + '%' : '—', 'نسبة الحضور'), stat('c-red', 'x', S.num(m.absences || 0), 'أيام الغياب'));
    if (w.assignments) stats.push(stat(m.pending ? 'c-amber' : 'c-teal', 'edit', S.num(m.pending || 0), 'واجبات معلّقة'), stat(m.upcoming ? 'c-blue' : 'c-violet', 'clock', S.num(m.upcoming || 0), 'اختبارات قريبة'));
    ct.innerHTML = `${stats.length ? `<div class="grid g4 mb16">${stats.join('')}</div>` : ''}
      ${(w.timetable && d.today && d.today.length) ? `<div class="sec-t" style="margin-top:0">${ic('calendar')} حصص اليوم</div><div class="card mb16"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>الحصة</th><th class="s">المادة</th><th>المعلّم</th><th>الغرفة</th></tr></thead><tbody>${d.today.map((t) => `<tr><td class="num b">${t.period}</td><td class="s b">${esc(t.subject || '—')}</td><td>${esc(t.teacher || '—')}</td><td>${esc(t.room || '—')}</td></tr>`).join('')}</tbody></table></div></div>` : ''}
      ${s.bus ? `<div class="sec-t">${ic('bus')} الحافلة</div><div class="card pad">${S.kv([['الحافلة', esc(s.bus.number)], ['السائق', esc(s.bus.driver_name || '—')], ['هاتف السائق', `<a class="num acc-t" href="tel:${esc(s.bus.driver_phone || '')}">${esc(s.bus.driver_phone || '—')}</a>`], ['خط السير', esc(s.bus.route || '—')]])}</div>` : ''}
      ${(!stats.length && !(d.today && d.today.length) && !s.bus) ? S.emptyHtml('اختر تبويباً من الأعلى لعرض تفاصيل المتابعة') : ''}`;
  }
  async function payments() {
    const d = await S.get('/portal/payments');
    v.innerHTML = `<div class="tbl-wrap">${d.data.length ? `<table class="tbl"><thead><tr><th>رقم السند</th><th>التاريخ</th><th>الطالب</th><th>المبلغ</th><th>الطريقة</th><th></th></tr></thead><tbody>${d.data.map((p, i) => `<tr><td class="num b">${esc(p.number)}</td><td class="num">${S.d(p.date)}</td><td>${esc(p.student_name || '')}</td><td class="num ok-t b">${S.fmtN(p.amount)}</td><td>${S.LBL.method[p.method] || p.method}</td><td><button class="ibtn p" data-p="${i}" title="طباعة">${ic('printer')}</button></td></tr>`).join('')}</tbody></table>` : S.emptyHtml('لا توجد مدفوعات', '', 'receipt')}</div>`;
    v.querySelectorAll('[data-p]').forEach((b) => (b.onclick = () => { const p = d.data[+b.dataset.p]; S.printReceipt ? S.printReceipt(p) : S.print('سند ' + p.number, `<h2>سند قبض ${esc(p.number)}</h2><div class="kv"><div><span>التاريخ</span><b>${S.d(p.date)}</b></div><div><span>الطالب</span><b>${esc(p.student_name || '')}</b></div><div><span>رقم العقد</span><b>${esc(p.contract_number || '')}</b></div><div><span>الطريقة</span><b>${S.LBL.method[p.method] || ''}</b></div></div><div class="big">${S.moneyT(p.amount)}</div><p style="text-align:center">${esc(p.description || '')}</p>`); }));
  }
  const route = async () => {
    const h = location.hash.replace('#/', ''), parts = h.split('/'), k = parts[0];
    // top nav (الرئيسية/المدفوعات) only — child sub-tabs mark their own active state
    document.querySelectorAll('.ptabs a[data-r]').forEach((a) => a.classList.toggle('on', a.dataset.r === (k === 'payments' ? 'payments' : '')));
    if (k === 'child' && parts[1] && String(CHILD.id) === String(parts[1]) && CHILD.data) return childSwitch(parts[1], parts[2] || 'overview'); // same child → just swap the tab, no refetch/spinner
    v.innerHTML = S.spinner;
    try { k === 'child' ? await child(parts[1], parts[2]) : k === 'payments' ? await payments() : await home(); } catch (e) { v.innerHTML = S.emptyHtml('تعذّر التحميل', e.message, 'alert'); }
  };
  function childSwitch(id, tab) {
    const d = CHILD.data, w = d.view || {};
    const ok = tab === 'overview' || (tab === 'assignments' && w.assignments && d.assignments) || (tab === 'grades' && w.grades && d.report) || (tab === 'attendance' && w.attendance && d.attendance) || (tab === 'timetable' && w.timetable && d.timetable) || (tab === 'behavior' && w.behavior && d.notes) || (tab === 'fees' && w.finance && d.contracts && d.contracts.length);
    if (!ok) tab = 'overview';
    v.querySelectorAll('.ptabs a[data-sub]').forEach((a) => a.classList.toggle('on', a.dataset.sub === tab));
    childTab(d, tab);
    window.scrollTo(0, 0);
  }
  window.onhashchange = route; route();
})();
</script>
</body>
</html>
