# Copy of the HOST nginx site (/etc/nginx/sites-available/schoole-domain, symlinked into sites-enabled).
# Kept in the repo for reference/reproducibility — the live file is the one under /etc/nginx.
# سكوول — public domain (behind Cloudflare, same origin pattern as the other smartunita sites).
# Both 80 and 443 proxy to the schoole-web container (127.0.0.1:8013) and tell the app it is https.
server {
    listen 80;
    listen [::]:80;
    server_name schoole.smartunita.com;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8013;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name schoole.smartunita.com;

    ssl_certificate     /etc/nginx/ssl/smart-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/smart-selfsigned.key;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8013;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}
