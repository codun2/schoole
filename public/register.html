<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سجّل مدرستك — سكوول</title>
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
<div class="auth">
  <div class="frm">
    <form id="f" novalidate style="max-width:460px">
      <a href="/" class="row" style="gap:10px"><b style="font-family:var(--head);font-size:20px" class="acc-t">سكوول</b></a>
      <div><h1>سجّل مدرستك مجاناً</h1><p class="muted">تجربة كاملة لمدة ١٤ يوماً بدون بطاقة ائتمان.</p></div>
      <div class="fgrid">
        <label class="fld full"><span>اسم المدرسة <i>*</i></span><input class="inp" name="school_name" required></label>
        <label class="fld"><span>المدينة</span><input class="inp" name="city"></label>
        <label class="fld"><span>الباقة</span><select class="inp" name="plan_id" id="plans"></select></label>
        <label class="fld full"><span>اسمك (مدير المدرسة) <i>*</i></span><input class="inp" name="name" required></label>
        <label class="fld"><span>البريد الإلكتروني <i>*</i></span><input class="inp" type="email" name="email" dir="ltr" required></label>
        <label class="fld"><span>الجوال <i>*</i></span><input class="inp" type="tel" name="phone" dir="ltr" required></label>
        <label class="fld full"><span>كلمة المرور <i>*</i></span><input class="inp" type="password" name="password" dir="ltr" minlength="6" required></label>
      </div>
      <div class="ferr hide" id="err"></div>
      <button class="btn" id="go">إنشاء حساب المدرسة</button>
      <p class="muted sm" style="text-align:center">لديك حساب؟ <a href="/login.html" class="acc-t b">تسجيل الدخول</a></p>
    </form>
  </div>
  <div class="art"><div></div><div><h2>ابدأ خلال دقائق.</h2><p>نجهّز لك السنة الدراسية والصناديق وفئات المصاريف وأنواع الإجازات تلقائياً — فقط أضف صفوفك وطلابك.</p></div><div id="pl" class="feats"></div></div>
</div>
<script src="/assets/js/core.js"></script>
<script>
const f = document.getElementById('f'), err = document.getElementById('err');
S.api('/public/plans').then((plans) => {
  document.getElementById('plans').innerHTML = plans.map((p) => `<option value="${p.id}" ${p.sort === 2 ? 'selected' : ''}>${S.esc(p.name)} — ${S.fmtN(p.price_monthly, 0)} ر.ع/شهر</option>`).join('');
  document.getElementById('pl').innerHTML = plans.map((p) => `<div><b>${S.esc(p.name)}</b>&nbsp;— ${S.fmtN(p.price_monthly, 0)} ر.ع شهرياً · ${p.max_students ? 'حتى ' + p.max_students + ' طالب' : 'طلاب بلا حدود'}</div>`).join('');
});
f.onsubmit = async (e) => {
  e.preventDefault(); err.classList.add('hide');
  const body = Object.fromEntries(new FormData(f));
  for (const k of ['school_name', 'name', 'email', 'phone', 'password']) if (!body[k]) { err.textContent = 'يرجى تعبئة الحقول المطلوبة'; err.classList.remove('hide'); return; }
  const b = document.getElementById('go'); S.btnBusy(b, true);
  try {
    await S.api('/register', { method: 'POST', body, noRedirect: true });
    const r = await S.api('/auth/login', { method: 'POST', body: { login: body.email, password: body.password }, noRedirect: true });
    S.setSession(r.token, r); location.href = '/app/#/schools';
  } catch (ex) { err.textContent = ex.message; err.classList.remove('hide'); S.btnBusy(b, false); }
};
</script>
</body>
</html>
